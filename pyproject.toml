[project]
name = "nushred"
version = "1.0.0"
description = "Shallow Recurrent Decoder (SHRED) for Nuclear Reactor Systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Stefano Riva", email = "stefano.riva@autodesk.com" },
]

dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "seaborn",
    "imageio",
    "opencv-python",
    "pyvista",
    "ipython",
    'ipykernel',
    "tqdm",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
# P1 — sensor placement (EIM/GEIM) notebooks, built on pyforce >= 1.0.0
p1 = [
    "rose-pyforce @ git+https://github.com/ERMETE-Lab/ROSE-pyforce.git@1.0.0#subdirectory=rose-pyforce",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shred"]

[tool.hatch.metadata]
allow-direct-references = true
